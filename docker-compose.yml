services:
  gijiroku-ai:
    build: .
    ports:
      - "${PORT:-8000}:8000"
    env_file: .env
    environment:
      # コンテナのタイムゾーン。未設定（UTC）だと会議日時の記録が
      # 日本時間から 9 時間ズレる
      TZ: ${TZ:-Asia/Tokyo}
      # SQLite ファイルは data_dir（バインドマウント）ではなく Docker named
      # volume に置く。Docker Desktop for Mac のバインドマウント上では WAL
      # モードのロックが不安定で disk I/O error が発生するため
      DB_DIR: /db_data
    volumes:
      - ./data:/data
      - db_data:/db_data
      # Vertex AI 用サービスアカウント鍵（.env の
      # GOOGLE_APPLICATION_CREDENTIALS と同じパスにマウントする）
      - ./gcp/service-account.json:/secrets/service-account.json:ro
    restart: unless-stopped

volumes:
  db_data:
