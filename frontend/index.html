<!doctype html>
<html lang="ja" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='30' fill='%23ff5100'/><text x='50' y='56' dominant-baseline='central' text-anchor='middle' font-family='-apple-system,system-ui,sans-serif' font-weight='700' font-size='56' fill='white'>議</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0a" />
    <title>議事録AI</title>
    <script>
      // 初回描画前にテーマを適用し、切り替え時のちらつきを防ぐ
      ;(function () {
        try {
          var saved = localStorage.getItem('gijiroku-theme')
          if (saved !== 'dark' && saved !== 'light') {
            saved = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
          }
          document.documentElement.dataset.theme = saved
        } catch (e) {
          document.documentElement.dataset.theme = 'dark'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
